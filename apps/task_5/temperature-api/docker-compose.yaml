version: "3.8"

services:
    sensor-service:
        build: ./sensor-service
        container_name: sensor-service
        ports:
            - "8080:8081"
        environment:
            - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/smarthome
        depends_on:
            db:
                condition: service_healthy
        restart: on-failure
        networks:
            - smarthome-network

    db:
        image: postgres:13
        container_name: postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: smarthome
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - smarthome-network

networks:
    smarthome-network:
        driver: bridge

volumes:
    postgres-data:
