version: "3.8"

services:
    zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0
        container_name: zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - "2181:2181"
        networks:
            - smart_home-network

    kafka:
        image: confluentinc/cp-kafka:7.4.0
        container_name: kafka
        depends_on:
            - zookeeper
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,PLAINTEXT_INTERNAL://kafka:9092
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            KAFKA_NUM_PARTITIONS: "1"
            KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        ports:
            - "9092:9092"
            - "9093:9093"
        healthcheck:
            test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 20s
        networks:
            - smart_home-network

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        depends_on:
            - kafka
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        ports:
            - "8090:8080"
        networks:
            - smart_home-network

    db:
        image: postgres:13
        container_name: postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./smart_home_db/init_devices_db.sql:/docker-entrypoint-initdb.d/init_devices_db.sql
            - ./smart_home_db/init_telemetry_db.sql:/docker-entrypoint-initdb.d/init_telemetry_db.sql
        networks:
            - smart_home-network

    telemetry_service:
        build: ./telemetry_service
        container_name: telemetry_service
        ports:
            - "5001:5001"
        environment:
            - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/telemetry_db
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            - KAFKA_SENSOR_TELEMETRY_TOPIC=${KAFKA_SENSOR_TELEMETRY_TOPIC}
            - KAFKA_RELAY_VALUES_CHANGED_TOPIC=${KAFKA_RELAY_VALUES_CHANGED_TOPIC}
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_healthy
        restart: on-failure
        networks:
            - smart_home-network

    device_service:
        build: ./device_service
        container_name: device_service
        ports:
            - "5002:5002"
        environment:
            - DATABASE_CON_STRING=Host=db;Database=devices_db;Username=postgres;Password=${POSTGRES_PASSWORD}
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            - KAFKA_SENSOR_TELEMETRY_TOPIC=${KAFKA_SENSOR_TELEMETRY_TOPIC}
            - KAFKA_RELAY_VALUES_CHANGED_TOPIC=${KAFKA_RELAY_VALUES_CHANGED_TOPIC}
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_healthy
        restart: on-failure
        networks:
            - smart_home-network

    smart_home:
        build: ./smart_home
        container_name: smart_home
        ports:
            - "8080:8080"
        environment:
            - TELEMETRY_SERVICE_URL=http://telemetry_service:5001
            - DEVICE_SERVICE_URL=http://device_service:5002
        depends_on:
            device_service:
                condition: service_started
            telemetry_service:
                condition: service_started
        restart: on-failure
        networks:
            - smart_home-network

networks:
    smart_home-network:
        driver: bridge

volumes:
    postgres-data:
